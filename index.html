<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Investimentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" onchange="toggleTheme()" />
            <div class="slider round"></div>
        </label>
        <span id="theme-label">Modo Claro</span>
    </div>

    <div class="container">
        <h1>Simulador de Investimentos</h1>

        <div class="form-group">
            <label for="aporteInicial">Aporte Inicial (R$)</label>
            <input type="text" inputmode="numeric" id="aporteInicial" placeholder="Ex: 1.000,00" oninput="formatCurrencyInput(this)">
        </div>

        <div class="form-group">
            <label for="meses">Quantidade de Meses</label>
            <input type="text" inputmode="numeric" id="meses" placeholder="Ex: 12" oninput="formatIntegerInput(this)">
        </div>

        <div class="form-group">
            <label for="aporteMensal">Aporte Mensal (R$)</label>
            <input type="text" inputmode="numeric" id="aporteMensal" placeholder="Ex: 500,00" oninput="formatCurrencyInput(this)">
        </div>

        <div class="form-group">
            <label for="taxaJuros">Taxa de Juros Anual (%)</label>
            <!-- Even though it's percentage, same text logic to allow comma -->
            <input type="text" inputmode="numeric" id="taxaJuros" placeholder="Ex: 10,50" oninput="formatCurrencyInput(this)">
        </div>

        <div class="button-group" id="action-buttons">
            <button class="btn-primary" onclick="simularInvestimento()">Simular</button>
            <button class="btn-secondary" onclick="limparCampos()">Limpar</button>
        </div>

        <div class="button-group hidden" id="reset-buttons">
            <button class="btn-primary" onclick="novaSimulacao()">Nova Simulação</button>
        </div>

        <!--Container de Resultados-->
        <div id="resultado-container" class="resultado-container hidden">
            <!-- Results will be injected here by JS -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
