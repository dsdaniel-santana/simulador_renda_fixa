<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Simulador de Investimentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <div class="lang-selector">
            <button onclick="changeLanguage('pt')" class="lang-btn active" id="btn-lang-pt">PT</button>
            <button onclick="changeLanguage('en')" class="lang-btn" id="btn-lang-en">EN</button>
            <button onclick="changeLanguage('es')" class="lang-btn" id="btn-lang-es">ES</button>
        </div>

        <div class="theme-switch-wrapper">
            <label class="theme-switch" for="checkbox">
                <input type="checkbox" id="checkbox" onchange="toggleTheme()" />
                <div class="slider round"></div>
            </label>
            <span id="theme-label" data-i18n="themeLight">Modo Claro</span>
        </div>
    </div>

    <div class="container">
        <h1 data-i18n="title">Simulador de Investimentos</h1>

        <div class="form-group">
            <label for="aporteInicial" data-i18n="labelAporteInicial">Aporte Inicial (R$)</label>
            <input type="text" inputmode="numeric" id="aporteInicial" data-i18n-placeholder="placeholderAporteInicial" placeholder="Ex: 1.000,00" oninput="formatCurrencyInput(this)">
        </div>

        <div class="form-group">
            <label for="meses" data-i18n="labelMeses">Quantidade de Meses</label>
            <input type="text" inputmode="numeric" id="meses" data-i18n-placeholder="placeholderMeses" placeholder="Ex: 12" oninput="formatIntegerInput(this)">
        </div>

        <div class="form-group">
            <label for="aporteMensal" data-i18n="labelAporteMensal">Aporte Mensal (R$)</label>
            <input type="text" inputmode="numeric" id="aporteMensal" data-i18n-placeholder="placeholderAporteMensal" placeholder="Ex: 500,00" oninput="formatCurrencyInput(this)">
        </div>

        <div class="form-group">
            <label for="taxaJuros" data-i18n="labelTaxaJuros">Taxa de Juros Anual (%)</label>
            <!-- Even though it's percentage, same text logic to allow comma -->
            <input type="text" inputmode="numeric" id="taxaJuros" data-i18n-placeholder="placeholderTaxaJuros" placeholder="Ex: 10,50" oninput="formatCurrencyInput(this)">
        </div>

        <div class="button-group" id="action-buttons">
            <button class="btn-primary" onclick="simularInvestimento()" data-i18n="btnSimular">Simular</button>
            <button class="btn-secondary" onclick="limparCampos()" data-i18n="btnLimpar">Limpar</button>
        </div>

        <div class="button-group hidden" id="reset-buttons">
            <button class="btn-primary" onclick="novaSimulacao()" data-i18n="btnNovaSimulacao">Nova Simulação</button>
        </div>

        <!--Container de Resultados-->
        <div id="resultado-container" class="resultado-container hidden">
            <!-- Results will be injected here by JS -->
            <h2 id="titulo-grafico" class="hidden" data-i18n="tituloGrafico">Crescimento do Patrimônio</h2>
            <div class="canvas-container">
                <canvas id="grafico-investimento"></canvas>
            </div>
            <div id="resultado-conteudo"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
