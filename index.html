<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Investimentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Simulador de Investimentos</h1>

        <div class="form-group">
            <label for="aporteInicial">Aporte Inicial (R$)</label>
            <input type="number" id="aporteInicial" placeholder="Ex: 1000.00" step="0.01">
        </div>

        <div class="form-group">
            <label for="meses">Quantidade de Meses</label>
            <input type="number" id="meses" placeholder="Ex: 12">
        </div>

        <div class="form-group">
            <label for="aporteMensal">Aporte Mensal (R$)</label>
            <input type="number" id="aporteMensal" placeholder="Ex: 500.00" step="0.01">
        </div>

        <div class="form-group">
            <label for="taxaJuros">Taxa de Juros Anual (%)</label>
            <input type="number" id="taxaJuros" placeholder="Ex: 10.5" step="0.01">
        </div>

        <button onclick="simularInvestimento()">Simular</button>

        <!--Container de Resultados-->
        <div id="resultado-container" class="resultado-container hidden">
            <!-- Results will be injected here by JS -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
